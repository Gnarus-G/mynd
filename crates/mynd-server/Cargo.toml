[package]
name = "mynd-server"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
axum = "0.8.4"
clap = { version = "4.5.4", features = ["derive"] }
mime_guess = "2.0.5"
rust-embed = "8.7.2"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
todo = { path = "../todo" }
tokio = { version = "1.38.0", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.10.1"
tower = { version = "0.5.2", features = ["util"] }
