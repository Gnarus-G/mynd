name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - name: Package installer
        run: install -m 0755 install.sh "mynd-installer-${GITHUB_REF_NAME}.sh"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mynd-installer-*.sh
